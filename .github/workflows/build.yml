name: Build and Release

on:
  push:
    branches: [ master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static executables (no libc or libstdc++ needed at run time), built natively.
          - name: linux-x86_64
            os: ubuntu-24.04
            cmake_flags: -DCMAKE_BUILD_TYPE=Release -DYAML2JSON_STATIC=ON
            binary_suffix: ""

          - name: linux-arm64
            os: ubuntu-24.04-arm
            cmake_flags: -DCMAKE_BUILD_TYPE=Release -DYAML2JSON_STATIC=ON
            binary_suffix: ""

          # macOS: only system libraries (libc++, libSystem); runs on macOS 11 and later.
          - name: macos-x86_64
            os: macos-15-intel
            cmake_flags: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            binary_suffix: ""

          - name: macos-arm64
            os: macos-15
            cmake_flags: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            binary_suffix: ""

          # Windows: static MSVC runtime, so no VCRUNTIME/MSVCP DLLs are needed.
          - name: windows-x86_64
            os: windows-2025
            cmake_flags: -A x64 -DYAML2JSON_STATIC=ON
            binary_suffix: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure CMake
      shell: bash
      run: cmake -S . -B build ${{ matrix.cmake_flags }}

    - name: Build
      shell: bash
      run: cmake --build build --config Release --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

    - name: Run tests
      shell: bash
      run: |
        cd build
        ctest --output-on-failure --build-config Release

    - name: Locate binary
      shell: bash
      run: |
        if [ -f build/Release/yaml2json${{ matrix.binary_suffix }} ]; then
          bin=build/Release/yaml2json${{ matrix.binary_suffix }}
        else
          bin=build/yaml2json${{ matrix.binary_suffix }}
        fi
        out=build/yaml2json-${{ matrix.name }}${{ matrix.binary_suffix }}
        cp "$bin" "$out"
        if [ "${{ runner.os }}" != "Windows" ]; then strip "$out"; fi
        echo "BINARY_PATH=$out" >> "$GITHUB_ENV"

    - name: Test binary
      shell: bash
      run: |
        cd build
        bin=./$(basename "$BINARY_PATH")
        printf 'test: value\n' > test.yaml
        "$bin" -i test.yaml -o output.json
        cat output.json
        "$bin" --version
        printf 'v: 1.10\nb: true\n---\nn: ~\n' > multi.yaml
        "$bin" --batch test.yaml multi.yaml | tee batch.jsonl
        test "$(wc -l < batch.jsonl)" -eq 3
        grep -q '"data":{"v":"1.10","b":true}' batch.jsonl

    - name: Show dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        file "$BINARY_PATH"
        ldd "$BINARY_PATH" || true

    - name: Show dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        file "$BINARY_PATH"
        otool -L "$BINARY_PATH"
        vtool -show-build "$BINARY_PATH" || true

    - name: Show dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
        & $dumpbin.FullName /dependents $env:BINARY_PATH

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: yaml2json-${{ matrix.name }}
        path: ${{ env.BINARY_PATH }}
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -name "yaml2json-*" -type f -exec cp {} release-assets/ \;
        chmod +x release-assets/*
        ls -la release-assets/
        file release-assets/*
        test "$(ls release-assets | wc -l)" -eq 5

    - name: Generate checksums
      run: |
        cd release-assets
        sha256sum yaml2json-* > checksums.txt
        cat checksums.txt

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        cat > notes.md << EOF
        ## yaml2json ${TAG}

        High-performance YAML to JSON converter.

        ### Downloads

        - **macOS ARM64** (Apple Silicon): \`yaml2json-macos-arm64\`
        - **macOS x86_64** (Intel): \`yaml2json-macos-x86_64\`
        - **Linux x86_64** (static): \`yaml2json-linux-x86_64\`
        - **Linux ARM64** (static): \`yaml2json-linux-arm64\`
        - **Windows x86_64**: \`yaml2json-windows-x86_64.exe\`

        ### Installation

        \`\`\`bash
        curl -L -o yaml2json https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/yaml2json-linux-x86_64
        chmod +x yaml2json
        sudo mv yaml2json /usr/local/bin/
        \`\`\`

        ### Verify Installation

        \`\`\`bash
        echo "test: value" | yaml2json
        # Should output: {"test": "value"}
        \`\`\`

        See \`checksums.txt\` for SHA256 checksums of all binaries.
        EOF
        gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md
